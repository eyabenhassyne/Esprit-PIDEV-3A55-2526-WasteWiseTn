framework:
    secret: '%env(APP_SECRET)%'

    router:
        default_uri: '%env(resolve:APP_URL)%'

    trusted_proxies: ['127.0.0.1', 'REMOTE_ADDR']
    trusted_headers:
        - 'x-forwarded-for'
        - 'x-forwarded-proto'
        - 'x-forwarded-port'
        - 'x-forwarded-host'

    session:
        enabled: true
        cookie_samesite: lax
        cookie_secure: auto
        handler_id: null
        storage_factory_id: session.storage.factory.native

    csrf_protection: true

    validation:
        enabled: true

    serializer:
        enabled: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
